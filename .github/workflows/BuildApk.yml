name: Generar APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Compilar APK
        run: |
          DIR=$(dirname "$(find . -name settings.gradle | head -1)")
          cd "$DIR"
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/CuentasDECOM.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: CuentasDECOM-apk
          path: CuentasDECOM.apk
