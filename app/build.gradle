plugins {
    id 'com.android.application'
}

android {
    namespace 'com.decom.cuentas'
    compileSdk 34

    defaultConfig {
        applicationId 'com.decom.cuentas'
        minSdk 29
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }

    // Llave fija: así cada APK nuevo se instala encima del anterior sin borrar los datos.
    signingConfigs {
        decom {
            storeFile file('decom-firma.jks')
            storePassword 'decom2026'
            keyAlias 'decom'
            keyPassword 'decom2026'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.decom
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.decom
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    androidResources {
        noCompress 'js', 'mjs'
    }
}

dependencies {
    // FileProvider: para que la cámara guarde la foto y para compartir archivos
    implementation 'androidx.core:core:1.13.1'
}
