plugins {
    id 'com.android.application'
}

android {
    namespace 'com.decom.cuentas'
    compileSdk 34

    defaultConfig {
        applicationId 'com.decom.cuentas'
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    androidResources {
        noCompress 'js', 'mjs'
    }
}

dependencies {
    // FileProvider: para que la cámara guarde la foto y para compartir archivos
    implementation 'androidx.core:core:1.13.1'
}
