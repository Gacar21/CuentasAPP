<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Cuentas DECOM</title>
  <link rel="stylesheet" href="styles.css">
  <script src="lib/jszip.min.js"></script>
  <script type="module" src="app.js"></script>
</head>
<body>

  <div id="splash" class="splash" aria-hidden="true">
    <img src="decom-logo.png" alt="">
    <p class="splash-brand">DECOM</p>
    <p class="splash-sub">Cuentas</p>
  </div>

  <!-- Bloqueo con PIN -->
  <div id="lock" class="lock" hidden>
    <img src="decom-logo.png" alt="" class="lock-logo">
    <p class="lock-title" id="lockTitle">Ingresa tu PIN</p>
    <div class="pin-dots" id="pinDots"><i></i><i></i><i></i><i></i></div>
    <p class="lock-error" id="lockError"></p>
    <div class="keypad" id="keypad">
      <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
      <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
      <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
      <button data-k="cancel" class="key-text" id="lockCancel">Cancelar</button><button data-k="0">0</button>
      <button data-k="del" aria-label="Borrar"><svg viewBox="0 0 24 24"><path d="M9 6h11v12H9l-6-6z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M12 10l4 4M16 10l-4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
    </div>
  </div>

  <div id="app" class="app">
    <main id="view" class="view"></main>

    <nav class="tabbar" aria-label="Secciones">
      <button data-tab="inicio" class="on"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg><span>Inicio</span></button>
      <button data-tab="movimientos"><svg viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1" fill="currentColor"/><circle cx="4" cy="12" r="1" fill="currentColor"/><circle cx="4" cy="18" r="1" fill="currentColor"/></g></svg><span>Movimientos</span></button>
      <button id="fab" class="fab" aria-label="Registrar movimiento"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg></button>
      <button data-tab="deudas"><svg viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h11l-3-3M17 17H6l3 3"/></g></svg><span>Deudas</span></button>
      <button data-tab="metas"><svg viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="0.8" fill="currentColor"/></g></svg><span>Metas</span></button>
    </nav>
  </div>

  <!-- Panel inferior reutilizable para todos los formularios -->
  <div id="sheetWrap" class="sheet-wrap" hidden>
    <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
  </div>

  <div id="confirm" class="confirm" hidden>
    <div class="confirm-card">
      <p id="confirmText"></p>
      <div class="confirm-actions">
        <button class="btn ghost" id="confirmNo">Cancelar</button>
        <button class="btn danger" id="confirmYes">Eliminar</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>
  <input type="file" id="fileInput" accept=".json,application/json" hidden>
</body>
</html>
